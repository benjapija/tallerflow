name: TallerFlow · validar y compilar
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool/render_preview_test.dart
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
        working-directory: tool
      - run: npm test
        working-directory: tool
  windows:
    needs: validate
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Verificar Visual Studio y ATL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath
          if (!$installation) { throw 'Falta Visual Studio C++ ATL en el entorno Windows' }
      - run: flutter pub get
      - run: flutter build windows --release --dart-define-from-file=config/pilot.public.json
      - name: Preparar instalador del piloto
        shell: pwsh
        run: iscc tool/windows-installer.iss
      - name: Identificar el código de la compilación
        shell: bash
        run: |
          mkdir -p build/deliverables
          python3 -c "import json,os; json.dump({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'runner':'${{ runner.os }}','platform':os.environ['GITHUB_JOB'],'realAuthValidated':False},open('build/deliverables/source-commit.json','w'),indent=2)"
      - uses: actions/upload-artifact@v4
        with:
          name: TallerFlow-Windows-piloto-${{ github.run_number }}
          path: |
            build/windows/x64/runner/Release/**
            build/installer/TallerFlow-Setup.exe
            build/deliverables/source-commit.json
          retention-days: 1
  ios-simulator:
    needs: validate
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --dart-define-from-file=config/pilot.public.json
      - name: Conservar permisos y enlaces del simulador iOS
        run: |
          mkdir -p build/deliverables
          tar -czf build/deliverables/TallerFlow-iOS-simulador.tar.gz -C build/ios/iphonesimulator Runner.app
      - name: Identificar el código de la compilación
        shell: bash
        run: |
          mkdir -p build/deliverables
          python3 -c "import json,os; json.dump({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'runner':'${{ runner.os }}','platform':os.environ['GITHUB_JOB'],'realAuthValidated':False},open('build/deliverables/source-commit.json','w'),indent=2)"
      - uses: actions/upload-artifact@v4
        with:
          name: TallerFlow-iOS-simulador
          path: |
            build/deliverables/*.tar.gz
            build/deliverables/source-commit.json
          retention-days: 1
  android:
    needs: validate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/pilot.public.json
      - name: Identificar el código de la compilación
        shell: bash
        run: |
          mkdir -p build/deliverables
          python3 -c "import json,os; json.dump({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'runner':'${{ runner.os }}','platform':os.environ['GITHUB_JOB'],'realAuthValidated':False},open('build/deliverables/source-commit.json','w'),indent=2)"
      - uses: actions/upload-artifact@v4
        with:
          name: TallerFlow-Android-piloto
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/deliverables/source-commit.json
          retention-days: 1
