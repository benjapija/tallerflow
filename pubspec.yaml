name: tallerflow
description: Gestión diaria de talleres, operarios y oficina.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  uuid: ^4.5.3
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
